<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اختبار الأساسيات الهندسية</title>
<style>
:root{--bg:#f4f3f0;--sf:#fff;--fg:#17171f;--mu:#666678;--bd:#e2e0da;--nv:#1a2744;--ok:#0a6640;--okb:#eaf5ef;--no:#c0392b;--nob:#fdf0ee;--am:#d97706;--bl:#1e40af}
@media(prefers-color-scheme:dark){:root{--bg:#0d1220;--sf:#18243a;--fg:#e6e8f2;--mu:#8a97b2;--bd:#263048;--nv:#0d1220;--ok:#34d399;--okb:#042216;--no:#f87171;--nob:#260a0a;--am:#f59e0b;--bl:#60a5fa}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:Tahoma,'Segoe UI',system-ui,sans-serif;line-height:1.7;font-size:16px}
header{background:var(--nv);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
header h1{font-size:17px}
.bar{height:6px;background:rgba(255,255,255,.2);border-radius:9px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--am);transition:width .25s}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
.meta{font-size:12px;color:var(--mu);margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);border-radius:99px;padding:0 9px}
.q{font-weight:700;margin-bottom:12px}
.q bdi,.opt bdi{unicode-bidi:isolate}
.opt{display:block;width:100%;text-align:right;background:var(--sf);color:var(--fg);border:1.5px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px;font:inherit;cursor:pointer;min-height:44px}
.opt:hover{border-color:var(--bl)}
.opt.sel{border-color:var(--bl);background:rgba(30,64,175,.08)}
.opt.ok{border-color:var(--ok);background:var(--okb)}
.opt.no{border-color:var(--no);background:var(--nob)}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:8px}
button.b{background:var(--nv);color:#fff;border:0;border-radius:10px;padding:11px 20px;font:inherit;font-weight:700;cursor:pointer;min-height:44px}
button.b.g{background:transparent;color:var(--fg);border:1.5px solid var(--bd)}
button.b:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--am);outline-offset:2px}
.big{font-size:44px;font-weight:900;text-align:center;color:var(--bl)}
.lvl{text-align:center;font-size:20px;font-weight:800;margin-bottom:6px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:right}
.pb{height:10px;background:var(--bd);border-radius:9px;overflow:hidden;min-width:90px}
.pb i{display:block;height:100%;background:var(--bl)}
.exp{font-size:14px;color:var(--mu);margin-top:8px}
.rv{border-right:4px solid var(--no);padding-right:12px;margin-bottom:14px}
.rv.good{border-color:var(--ok)}
h2{font-size:17px;margin:6px 0}
</style>
</head>
<body>
<header><h1>🎓 اختبار الأساسيات — مفاهيم بدون أرقام</h1><div class="bar"><i id="pg"></i></div></header>
<main id="app"></main>
<script>
// [موضوع, مستوى(1 سهل،2 متوسط،3 صعب), السؤال, [الخيارات: الأولى هي الصحيحة], شرح]
const Q=[
["ميكانيكا المواد",1,"ما تعريف الإجهاد (Stress)؟",["القوة المؤثرة على وحدة المساحة","التغير في الطول","القوة مضروبة في المسافة","الطول الأصلي للعنصر"],"الإجهاد = القوة ÷ المساحة."],
["ميكانيكا المواد",1,"ما هو الانفعال (Strain)؟",["نسبة التشوه إلى الطول الأصلي وهو بلا وحدة","القوة على وحدة المساحة","مقدار العزم المؤثر","مقاومة المادة للحرارة"],"الانفعال = الاستطالة ÷ الطول الأصلي."],
["ميكانيكا المواد",1,"ماذا تعني المنطقة المرنة (Elastic) في منحنى الإجهاد والانفعال؟",["المادة ترجع لشكلها الأصلي عند زوال الحمل","المادة تتشوه بشكل دائم","المادة تبدأ بالتخصّر","المادة تنكسر"],"التشوه في المنطقة المرنة قابل للاسترداد."],
["ميكانيكا المواد",1,"ماذا يحدث عند بلوغ نقطة الخضوع (Yielding)؟",["يبدأ التشوه الدائم","تنكسر المادة فورًا","تزداد صلابة المادة فقط","يتوقف أي تشوه"],"بعد الخضوع لا ترجع المادة لشكلها الأصلي كاملًا."],
["ميكانيكا المواد",1,"معامل يونغ (Young's Modulus) يقيس:",["صلابة المادة ومقاومتها للتشوه المرن","قدرة المادة على التمدد بالحرارة","مقاومة المادة للتآكل","كثافة المادة"],"كلما زاد E كانت المادة أصلب."],
["ميكانيكا المواد",1,"ما الفرق بين الإجهاد العمودي وإجهاد القص؟",["العمودي عمودي على السطح والقص موازٍ له","العمودي موازٍ للسطح والقص عمودي عليه","كلاهما عمودي على السطح","كلاهما موازٍ للسطح"],"الشد والضغط والانحناء إجهادات عمودية، والقص ينزلق موازيًا للسطح."],
["ميكانيكا المواد",1,"في الاصطلاح الشائع، إشارة إجهاد الشد:",["موجبة","سالبة","صفر دائمًا","تعتمد على لون المادة"],"الشد موجب والضغط سالب."],
["ميكانيكا المواد",2,"نسبة بواسون (Poisson's Ratio) هي نسبة:",["الانفعال الجانبي إلى الانفعال المحوري بقيمة موجبة","الإجهاد إلى الانفعال","القص إلى الشد","الطول إلى العرض"],"عند الشد يطول العنصر ويضيق عرضه."],
["ميكانيكا المواد",1,"ما المحور المحايد (Neutral Axis) في الانحناء؟",["الخط الذي ينعدم عنده إجهاد الانحناء","الخط الذي عنده أقصى شد","الخط الذي عنده أقصى ضغط","حافة المقطع السفلية"],"فوقه شد وتحته ضغط أو العكس، وعنده لا شد ولا ضغط."],
["ميكانيكا المواد",2,"كيف يتوزع إجهاد الانحناء على ارتفاع المقطع؟",["خطيًا، وأقصاه عند الألياف الخارجية","منتظمًا على كل المقطع","أقصاه عند المحور المحايد","عشوائيًا"],"يتدرج من الصفر عند المحور المحايد إلى الأقصى عند الحواف."],
["ميكانيكا المواد",1,"لماذا يفضّل مهندس الإنشاءات الكمرة ذات عزم القصور الذاتي الأكبر؟",["لأنها تقاوم الانحناء أكثر","لأنها أخف دائمًا","لأنها أرخص دائمًا","لأنها لا تتأثر بالحرارة"],"I يعبّر عن مقاومة شكل المقطع للانحناء."],
["ميكانيكا المواد",2,"أين يكون إجهاد القص أكبر ما يمكن في شافت مصمت يتعرض للالتواء؟",["على السطح الخارجي","في المركز","في منتصف نصف القطر دائمًا","منتظم في كل المقطع"],"ينعدم عند المركز ويكبر خطيًا نحو السطح."],
["ميكانيكا المواد",2,"ما الذي يحدث لقضيب معدني مثبّت من الطرفين عند تسخينه؟",["يتولد فيه إجهاد ضغط لأنه ممنوع من التمدد","يتولد فيه إجهاد شد","لا يتولد فيه أي إجهاد","ينكمش طوله"],"التمدد الحراري الممنوع يتحول إلى إجهاد ضغط."],
["ميكانيكا المواد",2,"ما التخصّر (Necking)؟",["تقلص موضعي في المقطع قبل الكسر في المواد المطيلة","تشقق سطحي بسبب الصدأ","زيادة مفاجئة في الصلابة","تمدد حراري"],"يحدث في المرحلة الأخيرة من منحنى الشد."],
["ميكانيكا المواد",3,"ما الإجهادات الرئيسية (Principal Stresses)؟",["إجهادات عمودية على مستويات ينعدم عليها إجهاد القص","أكبر إجهادات القص في العنصر","متوسط الإجهادات في المقطع","الإجهادات الحرارية فقط"],"المستوى الرئيسي لا يحمل قصًا."],
["ميكانيكا المواد",2,"ما فائدة دائرة مور (Mohr's Circle)؟",["طريقة بيانية لتحويل الإجهادات وإيجاد الرئيسية وأقصى قص","حساب الاستطالة المحورية","رسم مخطط العزوم","تحديد معامل المرونة"],"تعطي الإجهادات على أي مستوى مائل بيانيًا."],
["ميكانيكا المواد",1,"ما الفرق بين المادة المطيلة (Ductile) والهشة (Brittle)؟",["المطيلة تتشوه كثيرًا قبل الكسر والهشة تنكسر بتشوه قليل","المطيلة تنكسر فجأة والهشة تتمدد كثيرًا","لا فرق بينهما","المطيلة لا تتأثر بالحمل"],"الفولاذ الطري مطيل والحديد الزهر هش."],
["ميكانيكا المواد",2,"أين يكون عزم الانحناء عند قيمته العظمى عادةً؟",["حيث تنعدم قوة القص","حيث تكون قوة القص أكبر ما يمكن","عند أي دعامة بسيطة","عند الأطراف الحرة دائمًا"],"ميل مخطط العزم يساوي القص، فالعزم أقصى حيث القص صفر."],
["ميكانيكا المواد",1,"الكمرة الناتئة (Cantilever) هي كمرة:",["مثبّتة من طرف واحد وحرة من الطرف الآخر","مسندة على دعامتين بسيطتين","مثبّتة من الطرفين","معلّقة بالكامل بكابلات"],"الطرف المثبّت يقاوم القوة والعزم معًا."],
["ميكانيكا المواد",2,"إجهاد الاتكاء (Bearing Stress) بين المسمار واللوح هو إجهاد:",["ضغط عمودي في منطقة التلامس","قص خالص","شد عمودي","التواء"],"ليس قصًا رغم ارتباطه بالوصلات."],
["إطفاء الحريق",1,"ما العناصر الثلاثة لمثلث الحريق؟",["وقود وحرارة وأكسجين","وقود وماء وهواء","حرارة وضغط ودخان","أكسجين وكهرباء ووقود"],"إزالة أي عنصر تُطفئ الحريق."],
["إطفاء الحريق",1,"ما وسيلة الإطفاء المناسبة لحريق زيوت المطابخ (الفئة K)؟",["مادة كيميائية رطبة (Wet Chemical)","ماء مباشر","مسحوق معادن خاص","هواء مضغوط"],"تتفاعل مع الزيت وتكوّن طبقة عازلة مبرِّدة."],
["إطفاء الحريق",1,"لماذا لا نطفئ حريقًا كهربائيًا بالماء المباشر؟",["لأن الماء موصل فيسبب خطر الصعق","لأن الماء يزيد الأكسجين","لأن الماء يبخر بسرعة","لأن الماء لا يبرّد"],"نستخدم ثاني أكسيد الكربون أو المسحوق الجاف."],
["إطفاء الحريق",1,"نظام الرشاشات الأكثر شيوعًا والأبسط هو:",["الأنابيب المبللة (Wet Pipe)","الأنابيب الجافة (Dry Pipe)","الإغراق (Deluge)","ما قبل التشغيل (Pre-Action)"],"الأنابيب فيه ممتلئة بالماء دائمًا."],
["إطفاء الحريق",2,"ما الميزة الأساسية لنظام الأنابيب الجافة (Dry Pipe)؟",["يصلح للأماكن المعرضة للتجمد","يعمل بإشارة كهربائية فقط","يفتح كل الرشاشات معًا","لا يحتاج إلى رشاشات"],"الهواء المضغوط في الأنابيب يمنع تجمد الماء داخلها."],
["إطفاء الحريق",2,"لماذا يستخدم نظام ما قبل التشغيل (Pre-Action) في غرف البيانات؟",["لأنه يمنع التفريغ الخاطئ بشرط كاشف وانكسار رشاش معًا","لأنه الأرخص","لأنه يعمل بالرغوة","لأنه لا يحتاج إلى ماء"],"يقلل خطر إتلاف المعدات بتسريب غير مقصود."],
["إطفاء الحريق",2,"نظام الإغراق (Deluge) يعمل بحيث:",["إشارة واحدة تفتح كل الرشاشات المفتوحة","ينكسر رشاش واحد فقط","يعمل بهبوط الضغط فقط","يعمل بلا ماء"],"رشاشاته مفتوحة وأنابيبه فارغة قبل التشغيل."],
["إطفاء الحريق",1,"ما وظيفة مضخة الجوكي (Jockey Pump)؟",["الحفاظ على ضغط الشبكة عند التسريبات الصغيرة","تغذية الشبكة وقت الحريق الكبير وحدها","تشغيل الإنذار","تخزين الماء"],"تعمل دوريًا ولا تتحمل حريقًا كبيرًا."],
["إطفاء الحريق",1,"لماذا توجد مضخة ديزل احتياطية؟",["لتعمل عند انقطاع الكهرباء","لتخفيض الضغط","لتبريد الغرفة","لتخزين الوقود فقط"],"هي آخر خط دفاع ولا تعتمد على الكهرباء."],
["إطفاء الحريق",1,"عند حريق في غرفة بها رشاشات زجاجية، ما الذي يعمل؟",["الرشاشات التي بلغت حرارتها درجة التشغيل فقط","كل رشاشات المبنى","أول رشاش فقط","لا شيء حتى يتدخل الأمن"],"كل رشاش يعمل باستقلال."],
["إطفاء الحريق",1,"لون السائل في الكبسولة الزجاجية للرشاش يدل على:",["درجة حرارة التشغيل","نوع الماء","اتجاه التركيب","سنة التصنيع"],"كل لون يقابل درجة تشغيل مختلفة."],
["إطفاء الحريق",2,"عند تصنيف الخطورة (Hazard Classification)، على ماذا يعتمد التصنيف؟",["الحمل الحريقي الفعلي في كل منطقة","اسم المبنى فقط","لون الجدران","عمر المبنى"],"المبنى الواحد قد يضم مناطق بتصنيفات مختلفة."],
["إطفاء الحريق",2,"حسب منحنى المضخة، ماذا يحدث للضغط عند زيادة التدفق؟",["ينخفض","يرتفع","لا يتغير","يتذبذب"],"العلاقة عكسية بين التدفق والضغط."],
["إطفاء الحريق",1,"ما وظيفة صمام عدم الرجوع (Check Valve)؟",["السماح بالتدفق في اتجاه واحد فقط","قياس الضغط","فتح الإنذار","خفض التدفق"],"يمنع رجوع الماء عكس الاتجاه."],
["إطفاء الحريق",2,"ما ميزة محبس OS&Y في شبكة الحريق؟",["يظهر ساق الحركة بوضوح فيُعرف أنه مفتوح أو مغلق","يعمل تلقائيًا بالحرارة","يخفض الضغط","يمنع الصدأ"],"وضعه مرئي من الخارج ويسهل الإشراف عليه."],
["إطفاء الحريق",1,"ما الصاعد (Riser) في شبكة الحريق؟",["أنبوب رأسي رئيسي يوزع الماء على الأدوار","رشاش في السقف","مضخة صغيرة","خزان علوي"],"تتفرع منه الأفرع الأفقية في كل دور."],
["إطفاء الحريق",2,"لماذا يمنع استخدام CO₂ في أماكن وجود أشخاص؟",["لأنه يخفض الأكسجين ويشكل خطرًا قاتلًا","لأنه يسبب الصدأ","لأنه يتلف الأثاث","لأنه لا يطفئ"],"يستخدم في أماكن غير مأهولة أو بعد الإخلاء."],
["إطفاء الحريق",3,"ما العلاقة بين نعومة سطح الأنبوب الداخلي وفقد الضغط؟",["الأنعم يعني فقدًا أقل","الأنعم يعني فقدًا أكبر","لا علاقة بينهما","الأخشن يعطي ضغطًا أعلى"],"معامل الخشونة أعلى يعني سطحًا أنعم وفقد ضغط أقل."]
];
const N=Q.length, LV=["","سهل","متوسط","صعب"];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let S;
function start(){
  S={i:0,items:shuf(Q.map((q,k)=>k)).map(k=>{const q=Q[k];const o=shuf(q[3].map((t,x)=>({t,c:x===0})));return{q,o,a:null}}),done:false};
  render();
}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(){
  const app=document.getElementById('app');
  document.getElementById('pg').style.width=(S.done?100:S.i/N*100)+'%';
  if(S.done)return result(app);
  const it=S.items[S.i];
  app.innerHTML=`<div class="card"><div class="meta"><span class="chip">سؤال ${S.i+1} / ${N}</span><span class="chip">${it.q[0]}</span><span class="chip">${LV[it.q[1]]}</span></div>
  <div class="q"><bdi>${esc(it.q[2])}</bdi></div>
  ${it.o.map((o,k)=>`<button class="opt ${it.a===k?'sel':''}" data-k="${k}"><bdi>${esc(o.t)}</bdi></button>`).join('')}
  <div class="nav"><button class="b g" id="pv" ${S.i?'':'disabled'}>السابق</button>
  <button class="b" id="nx" ${it.a===null?'disabled':''}>${S.i===N-1?'إنهاء الاختبار':'التالي'}</button></div></div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{it.a=+b.dataset.k;render()});
  document.getElementById('pv').onclick=()=>{S.i--;render()};
  document.getElementById('nx').onclick=()=>{if(S.i===N-1){S.done=true}else S.i++;render();scrollTo(0,0)};
}
function pct(a,b){return b?Math.round(a/b*100):0}
function rate(p){return p>=90?"ممتاز — أساس هندسي متين":p>=75?"جيد جدًا — أساسك الهندسي قوي":p>=60?"جيد — فهم مقبول مع ثغرات":p>=40?"متوسط — يحتاج مراجعة مركزة":"ضعيف — ابدأ من الأساسيات"}
function result(app){
  const ok=S.items.filter(i=>i.o[i.a].c).length;
  const by=(f)=>{const m={};S.items.forEach(i=>{const k=f(i);m[k]=m[k]||[0,0];m[k][1]++;if(i.o[i.a].c)m[k][0]++});return m};
  const topics=by(i=>i.q[0]), lv=by(i=>LV[i.q[1]]);
  const row=(n,[a,b])=>`<tr><td>${n}</td><td>${a} / ${b}</td><td><div class="pb"><i style="width:${pct(a,b)}%"></i></div></td><td>${pct(a,b)}%</td></tr>`;
  const wrong=S.items.filter(i=>!i.o[i.a].c);
  app.innerHTML=`<div class="card"><div class="big">${ok} / ${N}</div><div class="lvl">${pct(ok,N)}% — ${rate(pct(ok,N))}</div>
  <h2>حسب المادة</h2><table>${Object.entries(topics).map(([k,v])=>row(k,v)).join('')}</table>
  <h2>حسب الصعوبة</h2><table>${["سهل","متوسط","صعب"].map(k=>row(k,lv[k]||[0,0])).join('')}</table></div>
  <div class="card"><h2>مراجعة الإجابات${wrong.length?` (${wrong.length} خطأ)`:''}</h2>
  ${wrong.length?'':'<p>أجبت على كل الأسئلة بشكل صحيح 🎉</p>'}
  ${wrong.map(i=>`<div class="rv"><div class="q"><bdi>${esc(i.q[2])}</bdi></div>
   <div>إجابتك: <b style="color:var(--no)"><bdi>${esc(i.o[i.a].t)}</bdi></b></div>
   <div>الصحيحة: <b style="color:var(--ok)"><bdi>${esc(i.o.find(o=>o.c).t)}</bdi></b></div>
   <div class="exp">${esc(i.q[4])}</div></div>`).join('')}
  </div><div class="nav"><button class="b" id="rs">إعادة الاختبار</button></div>`;
  document.getElementById('rs').onclick=()=>{start();scrollTo(0,0)};
  scrollTo(0,0);
}
start();
</script>
</body>
</html>
